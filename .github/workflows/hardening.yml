# kilocode_change - new file
# Restricted-egress build: checks that run on every pull request and push (see docs/HARDENING.md).
name: hardening

on:
  pull_request:
  push:
    branches: [main, "claude/**", "hardened/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Hardening checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Fetch the upstream base tag
        run: |
          tag="$(cat packages/kilo-hardening/UPSTREAM)"
          git fetch --no-tags https://github.com/Kilo-Org/kilocode "refs/tags/${tag}:refs/tags/upstream-${tag}"

      - name: Hardening package (typecheck, unit tests)
        working-directory: packages/kilo-hardening
        run: |
          bun run typecheck
          bun test

      - name: URL canary
        working-directory: packages/kilo-hardening
        run: bun script/canary.ts

      - name: Patch inventory is current
        working-directory: packages/kilo-hardening
        run: bun script/inventory.ts --check

      - name: Upstream changes are annotated
        run: bun run script/check-opencode-annotations.ts --base "upstream-$(cat packages/kilo-hardening/UPSTREAM)"

      - name: CLI (typecheck, hardening tests)
        working-directory: packages/opencode
        run: |
          bun run typecheck
          bun test ./test/kilocode/hardening

      - name: Telemetry stays off
        working-directory: packages/kilo-telemetry
        run: bun test src/__tests__/hardened.test.ts

      - name: VS Code extension (typecheck, lint, knip, unit tests, bundle)
        working-directory: packages/kilo-vscode
        run: |
          bun run check-types
          bun run check-types:webview
          bun run lint
          bun run knip
          bun run test:unit
          bun esbuild.js

  egress:
    name: Zero-egress integration test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bun

      # A fresh network namespace has only a loopback interface: the CLI runs with no route to anywhere.
      - name: Scripted session with no network
        run: |
          sudo env "PATH=$PATH" unshare --net sh -c '
            ip link set lo up
            cd packages/kilo-hardening
            bun script/egress-test.ts
          '

  # Acceptance: existing upstream test suites pass. The same suites run on this branch and on the exact
  # upstream base tag, on the same runner image; only tests that pass upstream and fail here count.
  base:
    name: Upstream base tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: packages/kilo-hardening/UPSTREAM
          sparse-checkout-cone-mode: false
      - id: tag
        run: echo "tag=$(cat packages/kilo-hardening/UPSTREAM)" >> "$GITHUB_OUTPUT"

  suites:
    name: Upstream suites (${{ matrix.side }} ${{ matrix.shard }}/4)
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        side: [fork, upstream]
        shard: [1, 2, 3, 4]
    env:
      TURBO_FORCE: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ matrix.side == 'upstream' && 'Kilo-Org/kilocode' || github.repository }}
          ref: ${{ matrix.side == 'upstream' && needs.base.outputs.tag || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: ./.github/actions/setup-bun

      - uses: ./.github/actions/setup-linux-sandbox

      - name: Configure git identity
        run: |
          git config --global user.email "ci@users.noreply.github.com"
          git config --global user.name "ci"

      # --continue: without it turbo stops scheduling packages after the first failure, so the two
      # sides would run different test sets.
      - name: Non-CLI unit tests
        if: matrix.shard == 1
        continue-on-error: true
        run: bun turbo test:ci --continue --output-logs=errors-only --filter='!@kilocode/cli' --filter='!@kilocode/kilo-jetbrains'
        env:
          KILO_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"

      - name: CLI unit tests
        continue-on-error: true
        run: bun turbo test:ci --continue --output-logs=errors-only --filter='@kilocode/cli'
        env:
          KILO_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
          KILO_TEST_SHARD: ${{ matrix.shard }}/4
          KILO_TEST_FILE_TIMEOUT: "600000"

      - uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.side }}-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .artifacts/unit/*.xml
            packages/*/.artifacts/unit/*.xml

  compare:
    name: No regressions against upstream
    needs: suites
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v8
        with:
          pattern: junit-fork-*
          path: reports/fork
      - uses: actions/download-artifact@v8
        with:
          pattern: junit-upstream-*
          path: reports/upstream
      - run: bun packages/kilo-hardening/script/compare-junit.ts reports/fork reports/upstream
